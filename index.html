<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#211b16">
    <meta name="description" data-i18n-content="app.description" content="一款以春秋战国为背景的俯视角战车战斗游戏。">
    <title data-i18n="app.title">春秋战国-车之战</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles/game.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="./" data-i18n-aria-label="app.home" aria-label="春秋战国-车之战首页">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span data-i18n="app.brand">春秋战国-车之战</span>
        </a>
        <p class="topbar-note" data-i18n="app.motto">周室衰微 · 群雄并起</p>
        <label class="language-control">
          <span class="sr-only" data-i18n="app.language">语言</span>
          <select id="locale-select" data-i18n-aria-label="app.language" aria-label="语言">
            <option value="zh-CN" data-i18n="app.language.zh-CN">简体中文</option>
            <option value="en" data-i18n="app.language.en">English</option>
          </select>
        </label>
        <button class="sound-button" id="sound-button" type="button" data-i18n-aria-label="app.sound" data-i18n-title="app.sound" aria-label="切换音效" title="切换音效">
          <span id="sound-icon" aria-hidden="true">♫</span>
        </button>
      </header>

      <section class="screen menu-screen" id="menu-screen" aria-labelledby="menu-heading">
        <!-- The card is one canvas (src/ui/menu.js); the heading stays in the page so
             the section has a name a screen reader can announce. -->
        <h1 class="sr-only" id="menu-heading" data-i18n="menu.title">逐鹿中原</h1>
        <canvas id="menu-canvas" class="menu-canvas" data-i18n-aria-label="menu.aria" aria-label="首页：逐鹿中原。按「击鼓出征」开始新的战役。"></canvas>
        <p class="sr-only" id="menu-live" role="status" aria-live="polite"></p>
        <!-- 出征 is painted, so this is the keyboard's and the screen reader's copy of
             it: invisible, never hit-tested, and moved onto the painted rect after
             every frame. Enter and Space reach it through the same click listener the
             DOM button had. -->
        <button class="menu-start-proxy" id="menu-start" type="button">
          <span data-i18n="menu.start">击鼓出征</span>
        </button>
      </section>

      <section class="screen prologue-screen" id="prologue-screen" hidden aria-labelledby="prologue-name">
        <div class="prologue-scroll">
          <p class="eyebrow prologue-eyebrow"><span class="status-dot"></span><span data-i18n="prologue.eyebrow">序章</span></p>
          <h2 class="prologue-name" id="prologue-name"></h2>
          <p class="prologue-subtitle" data-i18n="prologue.title">身世</p>
          <div class="prologue-rule" aria-hidden="true"></div>
          <p class="prologue-line" id="prologue-birth" style="--line-index: 0"></p>
          <p class="prologue-line prologue-line-name" id="prologue-name-line" style="--line-index: 1"></p>
          <p class="prologue-line" id="prologue-clan" style="--line-index: 2"></p>
          <p class="prologue-line" id="prologue-given" style="--line-index: 3"></p>
          <p class="prologue-line" id="prologue-ambition" style="--line-index: 4"></p>
          <p class="prologue-line" id="prologue-final" style="--line-index: 5" hidden></p>
          <div class="prologue-actions">
            <button class="secondary-action" id="prologue-tutorial" type="button"><span data-i18n="prologue.tutorial">猛虎下山 · 教学</span><span aria-hidden="true">◆</span></button>
            <button class="primary-action" id="prologue-start" type="button"><span data-i18n="prologue.begin">出征</span><span aria-hidden="true">→</span></button>
          </div>
        </div>
      </section>

      <section class="screen shop-screen" id="shop-screen" hidden data-i18n-aria-label="shop.dossier.label" aria-label="战车与随从">
        <canvas id="shop-canvas" class="shop-canvas" data-i18n-aria-label="shop.aria" aria-label="整备：左侧为战车属性、车马与营地，右侧为购买清单。"></canvas>
        <p class="sr-only" id="shop-live" role="status" aria-live="polite"></p>
      </section>

      <section class="game-layout screen" id="battle-screen" data-i18n-aria-label="battle.label" aria-label="春秋战国-车之战" hidden>
        <div class="field-frame">
          <div class="canvas-wrap">
            <canvas id="game" data-i18n-aria-label="battle.aria" aria-label="春秋战国战场。战车阶段W、S沿地图上下加速，A、D转向并造成漂移，空格发射弩箭；下车后WASD移动，空格近战。"></canvas>
            <section class="battle-hud" data-i18n-aria-label="battle.status" aria-label="战场状态">
              <div class="stats" aria-live="polite">
                <div class="stat battle-score">
                  <span class="stat-label" data-i18n="battle.score">战功</span>
                  <strong id="score">00000</strong>
                </div>
                <div class="treasury"><span data-i18n="shop.treasury">军资</span><strong id="gold">0</strong><span data-i18n="shop.currency">两</span></div>
                <div class="stat">
                  <span class="stat-label" data-i18n="battle.stage">战局</span>
                  <strong id="wave">01</strong>
                </div>
              </div>
              <div class="battle-hud-details">
                <div class="mode-block">
                  <span class="stat-label" data-i18n="battle.mode">作战形态</span>
                  <strong id="party-mode" class="party-mode" data-i18n="battle.chariot">战车</strong>
                </div>
                <div class="hull-block">
                  <div class="hull-caption"><span id="hull-label" class="stat-label" data-i18n="battle.hull">战车耐久</span><strong id="hull-value">100</strong></div>
                  <div class="hull-track"><span id="hull-health"></span></div>
                </div>
                <div class="objective-block">
                  <div class="hull-caption"><span class="stat-label" id="objective-label" data-i18n="battle.objective">本役目标</span><strong id="objective-count">0 / 8</strong></div>
                  <div class="hull-track"><span id="objective-progress"></span></div>
                </div>
              </div>
            </section>
            <div class="extraction-guide" id="extraction-guide" hidden aria-live="polite">
              <span class="extraction-arrow" id="extraction-arrow" aria-hidden="true">↑</span>
              <span class="extraction-guide-copy"><strong id="extraction-guide-label" data-i18n="battle.extractGuide">前往撤离点</strong><small id="extraction-distance"></small></span>
            </div>
            <div class="boss-warning" id="boss-warning" hidden role="alert">
              <span class="boss-warning-mark" aria-hidden="true">!</span>
              <span class="boss-warning-copy"><strong id="boss-warning-title"></strong><small id="boss-warning-subtitle"></small></span>
            </div>
            <button class="start-button" id="start-button" type="button" data-i18n-aria-label="battle.pauseLabel" aria-label="暂停战局">
              <span id="start-label" data-i18n="battle.startLabel">整军出征</span><span aria-hidden="true">↗</span>
            </button>
            <!-- The one card. Pause, defeat, victory and the two cards of the drill
                 are the same element, painted from a different spec by
                 src/ui/battle-card.js - the copy lives in the locale tables, never
                 here. -->
            <div class="game-overlay hidden" id="battle-card" role="dialog" aria-modal="true" aria-labelledby="card-title">
              <div class="overlay-card">
                <span class="overlay-icon" id="card-icon" aria-hidden="true">✦</span>
                <p class="eyebrow" id="card-eyebrow"></p>
                <h2 id="card-title"></h2>
                <p class="card-copy" id="card-copy"></p>
                <ul class="card-lines" id="card-lines" hidden></ul>
                <button class="overlay-button" id="card-button" type="button"><span id="card-action"></span><span aria-hidden="true">→</span></button>
              </div>
            </div>
            <div class="touch-controls" data-i18n-aria-label="battle.touch" aria-label="触屏操作">
              <div class="touch-pad" id="touch-pad" role="group" data-i18n-aria-label="battle.touchDirection" aria-label="战车方向">
                <div class="touch-joystick" id="touch-joystick" role="application" data-i18n-aria-label="battle.joystick" aria-label="方向摇杆">
                  <span class="touch-joystick-mark touch-joystick-mark-up" aria-hidden="true"></span>
                  <span class="touch-joystick-mark touch-joystick-mark-right" aria-hidden="true"></span>
                  <span class="touch-joystick-mark touch-joystick-mark-down" aria-hidden="true"></span>
                  <span class="touch-joystick-mark touch-joystick-mark-left" aria-hidden="true"></span>
                  <span class="touch-joystick-knob" id="touch-joystick-knob" aria-hidden="true"></span>
                </div>
              </div>
              <div class="touch-actions">
                <button class="touch-key touch-order" id="touch-order" type="button" hidden data-i18n="battle.sortie" data-i18n-aria-label="battle.sortie.hint" aria-label="出击">出击</button>
                <button class="touch-key touch-fire" type="button" data-control=" " data-i18n="battle.attack.short" data-i18n-aria-label="battle.attack" data-i18n-title="battle.attack.hint" aria-label="弩射或近战攻击">弩 / 击</button>
              </div>
              <p class="touch-hint" id="touch-hint" data-i18n="battle.touchHint">↑ 前进 · ↓ 后退 · ← → 转向</p>
            </div>
          </div>
        </div>
      </section>
      <footer class="page-footer">
        <span data-i18n="app.brand">春秋战国-车之战</span>
        <span data-i18n="app.footer">礼崩乐坏 · 群雄逐鹿</span>
      </footer>
    </main>
    <div class="fatal-error" id="fatal-error" hidden role="alert" aria-live="assertive">
      <strong data-i18n="app.error.title">战场中断</strong>
      <p id="fatal-error-copy"></p>
      <button type="button" id="fatal-error-reload" data-i18n="app.error.reload">刷新页面</button>
    </div>
  </body>
</html>
