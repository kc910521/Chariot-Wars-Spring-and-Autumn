name: checks

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: find src -name '*.js' -exec node --check {} \;
      - name: Unit tests
        run: node scripts/unit-test.mjs
      - name: Smoke test
        run: node scripts/smoke-test.mjs
